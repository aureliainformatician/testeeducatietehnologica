<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TESTUL 6 - Tehnologii Artizanale și Specific Tradițional (Verde Neon)</title>

<style>
  :root {
    --neon-green: #00ff66;
    --neon-glow: rgba(0, 255, 102, 0.4);
    --dark-bg: #080f0a;
    --card-bg: #0f1c12;
    --text-main: #f0fdf4;
    --accent-red: #ff3366;
    --accent-gold: #ffcc00;
  }

  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: var(--dark-bg); color: var(--text-main); margin: 0; padding: 20px; }
  .quiz-container { max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 12px; border: 1px solid var(--neon-green); box-shadow: 0 0 25px var(--neon-glow); }

  h1 { text-align: center; color: var(--neon-green); text-shadow: 0 0 12px var(--neon-green); margin-bottom: 5px; font-size: 24px; text-transform: uppercase; }
  .subtitle { text-align: center; color: #86efac; margin-bottom: 20px; font-size: 14px; font-weight: 600; }

  /* Date Elev */
  .student-info { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #142a1b; padding: 15px; border-radius: 8px; border: 1px solid rgba(0,255,102,0.3); margin-bottom: 20px; }
  .student-info label { font-size: 13px; color: var(--neon-green); font-weight: bold; }

  /* Cronometru */
  .timer-bar { display: flex; justify-content: space-between; align-items: center; background: #142a1b; padding: 12px 20px; border-radius: 8px; border: 1px solid var(--neon-green); margin-bottom: 25px; box-shadow: inset 0 0 10px var(--neon-glow); }
  .timer-display { font-size: 24px; font-weight: bold; color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green); }
  .timer-btn { background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 6px 14px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-weight: 600; }
  .timer-btn:hover { background: var(--neon-green); color: var(--dark-bg); box-shadow: 0 0 12px var(--neon-green); }

  /* Sectiuni */
  .section { margin-bottom: 30px; border: 1px solid rgba(0, 255, 102, 0.3); border-radius: 8px; padding: 20px; background: rgba(12, 28, 17, 0.7); }
  .section-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--neon-green); padding-bottom: 8px; margin-bottom: 18px; }
  .section-title { font-size: 18px; font-weight: bold; color: var(--neon-green); text-transform: uppercase; letter-spacing: 0.5px; }
  .section-points { background: rgba(0,255,102,0.15); border: 1px solid var(--neon-green); color: var(--neon-green); font-size: 13px; padding: 4px 10px; border-radius: 12px; font-weight: bold; }

  /* Intrebari */
  .question { margin-bottom: 20px; background: #142a1b; padding: 16px; border-radius: 8px; border-left: 4px solid var(--neon-green); position: relative; }
  .q-title { font-weight: 600; margin: 0 0 10px 0; color: #ffffff; display: flex; justify-content: space-between; font-size: 15px; }
  .q-points { color: var(--neon-green); font-size: 13px; font-weight: bold; }

  /* Optiuni si Campuri Text */
  .options label { display: block; margin: 8px 0; cursor: pointer; font-size: 14px; color: #d1fae5; }
  .options input[type="radio"] { accent-color: var(--neon-green); margin-right: 8px; }
